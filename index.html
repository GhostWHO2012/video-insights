<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Video Insights</title><style>:root{--fg:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f6f7fb;--card:#fff;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}header{padding:38px 22px 26px;background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:0 auto}h1{margin:0 0 10px;font-size:34px}p{margin:0;color:var(--muted);line-height:1.7}main{padding:0 22px}.toolbar{display:flex;gap:12px;margin:24px 0 18px;align-items:center}input{flex:1;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:15px}.stats{color:var(--muted);font-size:14px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding-bottom:48px}.card{display:block;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:.16s ease;min-height:285px}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.08);text-decoration:none}.thumb{width:100%;aspect-ratio:16/9;background:#e5e7eb;object-fit:cover;display:block}.body{padding:15px}.date{color:var(--muted);font-size:13px;margin-bottom:8px}.title{font-weight:750;line-height:1.45;margin-bottom:8px}.meta{color:var(--muted);font-size:13px;line-height:1.6}.links{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.links span{color:var(--accent);font-size:13px}@media(max-width:720px){h1{font-size:28px}.toolbar{flex-direction:column;align-items:stretch}}</style></head><body><header><div class="wrap"><h1>Video Insights</h1><p>AI 视频字幕、洞见目录、B站简介、中文时间轴与提纲图合集。</p></div></header><main class="wrap"><div class="toolbar"><input id="q" placeholder="搜索标题、嘉宾、频道、关键词..."/><div class="stats" id="stats"></div></div><div class="grid" id="grid"></div></main><script>const grid=document.getElementById('grid'),q=document.getElementById('q'),stats=document.getElementById('stats');let episodes=[];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function render(){const keyword=q.value.trim().toLowerCase();const list=episodes.filter(e=>JSON.stringify(e).toLowerCase().includes(keyword));stats.textContent=`${list.length} / ${episodes.length}`;grid.innerHTML=list.map(e=>`<a class="card" href="${esc(e.path)}">${e.cover?`<img class="thumb" src="${esc(e.path)}cover.jpeg" alt="">`:''}<div class="body"><div class="date">${esc(e.published_at||'待补充')}</div><div class="title">${esc(e.bilibili_title||e.folder_title)}</div><div class="meta">原题：${esc(e.original_title||'待补充')}</div><div class="meta">字幕 ${esc(e.subtitle_count)} · 提纲图 ${esc(e.outline_count)}</div><div class="links"><span>资源</span><span>字幕</span><span>时间轴</span><span>提纲图</span></div></div></a>`).join('');}fetch('data/episodes.json').then(r=>r.json()).then(data=>{episodes=data;render();});q.addEventListener('input',render);</script></body></html>
