<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>如何在 agent 时代做设计｜Stephen Haney - 时间轴</title><style>:root{--fg:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f6f7fb;--card:#fff;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 52px}h1{font-size:30px;line-height:1.3;margin:0 0 12px}h2{font-size:20px;margin:30px 0 14px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}.resource{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.cover{width:100%;border-radius:10px;border:1px solid var(--line);display:block}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;background:#fff;color:#1d4ed8;font-weight:600}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.outline-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.outline-row a{flex:0 0 300px}.outline-row img{width:300px;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.transcript{display:flex;flex-direction:column;gap:10px}.cue{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}.time{font-size:13px;color:#2563eb;font-weight:700;margin-bottom:6px}.cn{font-size:16px;line-height:1.65}.en{font-size:14px;line-height:1.55;color:#667085;margin-top:5px}.timeline li{margin:7px 0;line-height:1.65}@media(max-width:760px){.resource{grid-template-columns:1fr}.outline-row a{flex-basis:240px}.outline-row img{width:240px}h1{font-size:24px}}</style></head><body><main class="wrap"><p><a href="./">返回本期目录</a></p><h
