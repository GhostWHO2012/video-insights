<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Insights</title>
  <style>
    :root { color-scheme: light; --fg:#172033; --muted:#667085; --line:#e4e7ec; --bg:#f6f7fb; --card:#fff; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color:var(--fg); background:var(--bg); }
    header { padding:36px 22px 24px; background:#fff; border-bottom:1px solid var(--line); }
    .wrap { max-width:1120px; margin:0 auto; }
    h1 { margin:0 0 10px; font-size:34px; letter-spacing:0; }
    p { margin:0; color:var(--muted); line-height:1.7; }
    .toolbar { display:flex; gap:12px; margin:24px 0 18px; align-items:center; }
    input { flex:1; height:42px; border:1px solid var(--line); border-radius:8px; padding:0 14px; font-size:15px; }
    .stats { color:var(--muted); font-size:14px; white-space:nowrap; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:14px; padding-bottom:40px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; min-height:168px; display:flex; flex-direction:column; gap:10px; }
    .date { color:var(--muted); font-size:13px; }
    .title { color:var(--fg); font-weight:700; text-decoration:none; line-height:1.45; }
    .title:hover { color:var(--accent); }
    .meta { color:var(--muted); font-size:13px; line-height:1.6; }
    .links { margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; }
    .links a { color:var(--accent); text-decoration:none; font-size:13px; }
    main { padding:0 22px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Video Insights</h1>
      <p>AI 视频字幕、洞见目录、B站简介、中文时间轴与提纲图合集。</p>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <input id="q" placeholder="搜索标题、嘉宾、频道、关键词..." />
      <div class="stats" id="stats"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const stats = document.getElementById('stats');
    let episodes = [];
    function esc(s){ return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function render(){
      const keyword = q.value.trim().toLowerCase();
      const list = episodes.filter(e => JSON.stringify(e).toLowerCase().includes(keyword));
      stats.textContent = `${list.length} / ${episodes.length}`;
      grid.innerHTML = list.map(e => `
        <article class="card">
          <div class="date">${esc(e.published_at || '待补充')}</div>
          <a class="title" href="${esc(e.path)}">${esc(e.bilibili_title || e.folder_title)}</a>
          <div class="meta">原题：${esc(e.original_title || '待补充')}</div>
          <div class="meta">字幕 ${esc(e.subtitle_count)} · 提纲图 ${esc(e.outline_count)}</div>
          <div class="links">
            ${e.bilibili_url ? `<a href="${esc(e.bilibili_url)}">B站</a>` : ''}
            ${e.youtube_url ? `<a href="${esc(e.youtube_url)}">原视频</a>` : ''}
            <a href="${esc(e.path)}subtitles/">字幕</a>
            <a href="${esc(e.path)}timeline.html">时间轴</a>
            <a href="${esc(e.path)}outlines/">提纲图</a>
          </div>
        </article>
      `).join('');
    }
    fetch('data/episodes.json').then(r => r.json()).then(data => { episodes = data; render(); });
    q.addEventListener('input', render);
  </script>
</body>
</html>
